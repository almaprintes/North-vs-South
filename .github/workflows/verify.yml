name: Verify DEV Prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static HTML and embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '<!doctype html>' in s.lower()
          assert '<script>' in s and '</script>' in s
          assert '</html>' in s
          assert 'THUMBS' in s and 'TABLETOP' in s
          Path('/tmp/nvs-app.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          print('HTML and prototype markers: OK')
          PYCODE
          node --check /tmp/nvs-app.js

      - name: Verify rig and PIN geometry
        shell: bash
        run: |
          node --check rig3d.js
          node --check rig2d.js
          node tests/rig.test.cjs

      - name: Check premium frame atlas
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          atlas=Path('assets/frames-north-v04.webp')
          assert atlas.is_file() and atlas.stat().st_size > 50000
          assert atlas.read_bytes()[:4] == b'RIFF'
          html=Path('index.html').read_text(encoding='utf-8')
          assert "frames-north-v04.webp" in html
          assert "SOUTH: secuencia pendiente de validación" in html
          assert "framePreview && currentFighter().hemi==='NORTH'" in html
          print('Experimental frame atlas present; opposite-side misuse guarded.')
          PYCODE
